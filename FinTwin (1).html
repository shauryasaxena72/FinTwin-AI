<script>

function sampleStatement(){let bal=850000,out=[SM];MON.forEach((m,i)=>{const mm=String(i+5).padStart(2,"0");[["02","Office rent",-65000],["05","Client payment Acme Ltd",m[0]],["07","Salary payroll",-180000],["12","Internet subscription",-4500],["15","Client payment Nova Retail",m[1]],["18","Raw materials supplier",-m[2]],["22","Courier and logistics",-m[3]],["27","Utilities electricity",-m[4]]].forEach(r=>{bal+=r[2];out.push(`2026-${mm}-${r[0]},${r[1]},${r[2]},${bal}`)})});return out.join("\n")}

function rows(text){const L=text.trim().split(/\r?\n/);const h=L.shift().split(",").map(x=>x.trim().toLowerCase().replace(/\s+/g,"_"));return L.filter(l=>l.trim()).map(l=>{const c=l.split(",");const o={};h.forEach((k,i)=>o[k]=(c[i]??"").trim());return o})}

function run(){
const X=S.txns,V=S.vendor,L=S.loan,miss=[];const mk=[...new Set(X.map(x=>x.date.slice(0,7)))].sort(),n=mk.length;

if(X.length&&lb===null&&S.opening===null)miss.push("Current cash balance: enter today’s balance on the Intake screen.");

const ls=[L.p,L.apr,L.term].some(v=>v!==null);if(ls){if(!L.p)miss.push("Loan offer: principal.");if(L.apr===null)miss.push("Loan offer: APR %.");if(!L.term)miss.push("Loan offer: term in months.")}

const H=12,sk=addM(mk[n-1],1),labels=Array.from({length:H},(_,i)=>lbl(addM(sk,i)));
const sum=c=>X.filter(x=>x.cls===c).reduce((a,x)=>a+x.amt,0);
const aI=sum("income")/n,aF=-sum("fixed")/n,aV=-sum("variable")/n,aC=aF+aV;
const cash=lb!==null?lb:S.opening,reserve=S.reserve*aC,surplus=aI-aC,runway=aC>0?cash/aC:Infinity;

const conf=ibm("confirmed"),exp=S.confOnly?Array(H).fill(0):ibm("expected");

function sim(s,rr=Array(H).fill(im*drop),ex=exp){let open=cash;return labels.map((label,i)=>{const shock=S.stress.sm===i+1?S.stress.shock:0;const inflow=rr[i]+conf[i]+ex[i]+s.i[i],outflow=aC+s.o[i]+shock,closing=open+inflow-outflow;const m={label,opening:open,rr:rr[i],conf:conf[i],exp:ex[i],fin:s.i[i],inflow,ops:aC,plan:s.o[i],shock,outflow,closing,breach:closing<reserve};open=closing;return m})}
const P=V.price,defs=[],starts=[1,2,3,4,6,9];
starts.forEach(m=>{const s=zero();s.o[m-1]+=P;defs.push({id:"cash-m"+m,kind:"cash",label:"Pay cash in "+labels[m-1],start:m,cost:0,cd:"No financing cost",s})});
if(V.im>0){const k=V.im,tot=P*(1+(V.imk||0)/100);starts.forEach(m=>{const s=zero();for(let j=0;j<k;j++)if(m-1+j<H)s.o[m-1+j]+=tot/k;defs.push({id:"inst-m"+m,kind:"inst",label:`${k} vendor instalments from ${labels[m-1]}`,start:m,cost:tot-P,cd:`Vendor markup ${V.imk||0}%`,s})})}
if(ls){const pr=L.p,k=L.term,r=L.apr/1200,emi=r===0?pr/k:pr*r*(1+r)**k/((1+r)**k-1),fee=pr*(L.fee||0)/100;starts.forEach(m=>{const s=zero();s.i[m-1]+=pr;s.o[m-1]+=P+fee;for(let j=1;j<=k;j++)if(m-1+j<H)s.o[m-1+j]+=emi;defs.push({id:"loan-m"+m,kind:"loan",label:"Loan-funded purchase in "+labels[m-1],start:m,cost:emi*k-pr+fee,cd:`Interest over ${k} months at ${L.apr}% APR + ${L.fee||0}% fee`,s})})}

if(mc){const tg=[{id:"original",s:zero()}];[fast,safest,cheap].forEach(p=>{if(p&&!tg.some(x=>x.id===p.id))tg.push({id:p.id,s:defs.find(d=>d.id===p.id).s})});

const bh=bt?`<p class='mut'>Each month is forecast using only earlier months, then compared with what actually happened. Average income error: <span class='mono'>${bt.mape.toFixed(1)}%</span>${bdg('engine','Mean absolute percentage error of the income forecast')}</p><div id='ch-b'></div><div class='sc'><table><thead><tr><th>Month</th><th>Forecast income</th><th>Actual income</th><th>Error</th></tr></thead><tbody>${bt.rows.map(x=>`<tr><td>${x.label}</td><td>${num(T(x.fi,'engine','Average income of all earlier months'))}</td><td>${num(T(x.ai,'statement','Income rows for that month'))}</td><td class='mono'>${x.err.toFixed(1)}%${bdg('engine','|forecast − actual| ÷ actual')}</td></tr>`).join('')}</tbody></table></div>`:`<p class='mut'>Needs at least 3 months of confirmed statement history.</p>`;
return head('Phase 2 · Analysis','Explore')+`<div class='card' style='margin-bottom:20px'><h3>Cost vs cushion ${bdg('engine','Each dot is a purchase plan evaluated by the engine')}</h3><p class='mut'>Up and to the left is better: lower financing cost, larger cushion above the reserve. The dotted line joins the Pareto-optimal safe plans.</p><div id='ch-p'></div></div>
<div class='card' style='margin-bottom:20px'><h3>Sensitivity (tornado) ${bdg('engine','Engine re-run with each input nudged')}</h3><p class='mut'>Effect on the lowest balance of: ${sn.label}</p><div id='ch-t'></div></div>
<div class='card' style='margin-bottom:20px'><h3>Saved scenarios</h3>${sv}</div><div class='card' style='margin-bottom:20px'><h3>Backtest: forecast vs actual</h3>${bh}</div>`}
// ---------- UI ----------
const $=id=>document.getElementById(id);
const ass=a=>`<details class="card"><summary>Assumptions</summary>${a.map(x=>`<div class="row" style="justify-content:flex-start">${bdg(x[0],x[1])}<span>${x[1]}</span></div>`).join("")}</details>`;
const missing=m=>`<div class="card warn"><h3>Not enough data to run the plan</h3><p class="mut">Nothing is estimated or filled in for you. Missing:</p><ul>${m.map(x=>`<li>${x}</li>`).join("")}</ul><a class="btn" href="#intake">Go to Intake</a></div>`;
const head=(e,t,x="")=>`<div class="top"><div><div class="eyebrow">${e}</div><h1 class="disp">${t}</h1></div>${x}</div>`;
function nf(l,v,o,k){return`<label>${l}</label><input inputmode="decimal" value="${v??""}" onchange="setF('${o}','${k}',this.value)">`}
function setF(o,k,v){const n=pn(v);if(o==="reserve")S.reserve=n??0;else if(o==="opening")S.opening=n;else S[o][k]=n;go()}
function setText(){}
async function load(e,kind){const f=e.target.files[0];if(f)ingest(await f.text(),f.name,kind)}
function ingest(t,name,kind){if(kind==="st"){const r=parseStatement(t);S.errs=r.e;S.txns=r.o;S.stName=r.o.length?name:null;S.confirmed=false}else{const r=parseInvoices(t);S.errs=r.e;S.inv=r.o;S.invName=r.o.length?name:null}go()}
function dropF(e,k){e.preventDefault();e.currentTarget.classList.remove('over');const f=e.dataTransfer.files[0];if(f)f.text().then(t=>ingest(t,f.name,k))}
function sample(){ingest(sampleStatement(),"bank_statement.csv","st");ingest(SAMPLE_INV,"invoices.csv","inv");S.vendor={price:600000,im:6,imk:8};S.loan={p:500000,apr:14,term:12,fee:1};S.confirmed=true;go()}
function intake(){const r=compute(),hb=S.txns.some(t=>t.bal!==null);
const up=(t,h,nm,c,k)=>`<div class="card"><h3>${t}</h3><div class="mut mono">${h}</div><label class="drop ${nm?"ok":""}" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="dropF(event,'${k}')">${nm?`✓ ${nm} · ${c} rows${bdg("user","Rows parsed from your uploaded file")}`:"Choose a CSV file"}<input type="file" accept=".csv,text/csv" hidden onchange="load(event,'${k}')"></label></div>`;
return head("Step 1 of 3","Bring in your numbers",`<div><button class="o" onclick="sample()">Load sample data</button> <a class="btn" href="#${r.ok?"lab":"intake"}" ${r.ok?"":'style="opacity:.45;pointer-events:none"'}>${r.ok?"See ranked plans →":"Complete intake to continue"}</a></div>`)+
`<div class="steps">${[["Upload statement",S.txns.length>0],["Add vendor quote",S.vendor.price>0],["Confirm rows",S.confirmed]].map((x,i)=>`<span class="${x[1]?"d":""}"><i>${x[1]?"✓":i+1}</i>${x[0]}</span>`).join("")}</div><div class="g g2">${up("Bank statement","date, description, amount | credit/debit, balance?",S.stName,S.txns.length,"st")}${up("Invoices (optional)","invoice_id, client, amount, due_date, status",S.invName,S.inv.length,"inv")}</div>
${S.errs.length?`<div class="card bad" style="margin-bottom:16px">${S.errs.slice(0,5).map(e=>`<div>• ${e}</div>`).join("")}</div>`:""}
<div class="g g2"><div class="card"><h3>Vendor quote</h3>${nf("Purchase price (₹)",S.vendor.price,"vendor","price")}${nf("Instalments (months)",S.vendor.im,"vendor","im")}${nf("Instalment markup (%)",S.vendor.imk,"vendor","imk")}</div>
<div class="card"><h3>Loan offer <span class="mut">(optional)</span></h3>${nf("Principal (₹)",S.loan.p,"loan","p")}${nf("APR (%)",S.loan.apr,"loan","apr")}${nf("Term (months)",S.loan.term,"loan","term")}${nf("Fee (%)",S.loan.fee,"loan","fee")}</div>
<div class="card"><h3>Safety settings</h3>${nf("Cash reserve to protect (months of costs)",S.reserve,"reserve","")}${S.txns.length&&!hb?nf("Today’s cash balance (₹)",S.opening,"opening",""):""}${hb?'<p class="mut">Cash balance is read from the statement’s balance column.</p>':""}</div></div>
<div class="card" style="padding:0;overflow:hidden;margin-bottom:16px"><div style="padding:16px"><h3>Review row classification</h3><p class="mut">Rows are pre-sorted by description. Fix anything wrong, then confirm.</p><div class="mono mut">${CLS.map(c=>`${c[1]}: ${S.txns.filter(t=>t.cls===c[0]).length}`).join(" · ")}${bdg("statement","Row counts from your statement")}</div></div>
${S.txns.length?`<div class="tw"><table><thead><tr><th>Date</th><th>Description</th><th style="text-align:right">Amount</th><th>Class</th></tr></thead><tbody>${S.txns.map(t=>`<tr><td class="mono">${t.date}</td><td>${t.desc}</td><td class="mono ${t.amt<0?"bad":"good"}" style="text-align:right">${inr(t.amt)}${bdg("statement","Bank statement row")}</td><td><select onchange="setCls('${t.id}',this.value)" style="width:auto">${CLS.map(c=>`<option value="${c[0]}" ${c[0]===t.cls?"selected":""}>${c[1]}</option>`).join("")}</select></td></tr>`).join("")}</tbody></table></div>
<div class="row" style="padding:12px 16px;align-items:center"><span>${S.confirmed?"✓ Classification confirmed.":"The plan won’t run until you confirm."}</span><button ${S.confirmed?"disabled":""} onclick="S.confirmed=true;go()">${S.confirmed?"Confirmed":"Confirm rows"}</button></div>`:`<p class="mut" style="padding:0 16px 20px;text-align:center">Missing: upload bank_statement.csv, or load the sample data.</p>`}</div>
${r.miss?`<div class="card warn"><h3>Still missing</h3>${r.miss.map(m=>`<div>• ${m}</div>`).join("")}</div>`:""}`}
function setCls(id,c){const t=S.txns.find(x=>x.id===id);t.cls=c;S.confirmed=false;go()}
const col=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function lay(o={}){return{height:o.h||360,margin:{l:75,r:15,t:15,b:40},paper_bgcolor:"rgba(0,0,0,0)",plot_bgcolor:"rgba(0,0,0,0)",font:{family:"Inter",color:col("--fg"),size:12},xaxis:{gridcolor:col("--bd")},yaxis:{gridcolor:col("--bd"),tickprefix:"₹",separatethousands:true},legend:{orientation:"h",y:-.2},...o.l}}
const resLine=r=>({type:"line",xref:"paper",x0:0,x1:1,y0:r,y1:r,line:{color:col("--bad"),dash:"dash",width:2}});
function overview(){const r=compute();if(!r.ok)return head("Step 2 of 3","Financial overview")+missing(r.miss);const o=r.ov;
const tile=(l,t,f,s)=>`<div class="card"><div class="eyebrow">${l}</div><div class="big ${t.v<0?"bad":""}" style="margin-top:6px">${num(t,f)}</div><div class="mut" style="margin-top:6px">${s}</div></div>`;
setTimeout(()=>Plotly.react("ch-ov",[{type:"scatter",mode:"lines+markers",name:"Projected balance (no purchase)",x:r.labels,y:r.original.map(m=>m.closing),line:{color:col("--pri"),width:3}}],lay({l:{shapes:[resLine(o.reserve.v)]}}),{displayModeBar:false,responsive:true}),0);
return head("Step 2 of 3","Financial overview",`<a class="btn" href="#lab">Open Scenario Lab →</a>`)+`<div class="g g4">${tile("Cash today",o.cash,"inr","Starting point for every projection")}${tile("Monthly surplus",o.surplus,"inr",`Based on your statement history`)}${tile("Reserve to protect",o.reserve,"inr","Dashed red line on every chart")}${tile("Runway",o.runway,"months","If revenue stopped today")}</div>
<div class="g" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))"><div class="card" style="grid-column:span 2"><h3>12-month baseline ${bdg("engine","Projected month-end balances, no purchase")}</h3><div id="ch-ov"></div></div>
<div class="card"><h3>Monthly run-rate</h3><div class="row"><span>Average income</span><span>${num(o.aI)}</span></div><div class="row"><span>Average costs</span><span>${num(o.aC)}</span></div><div class="row" style="border-top:1px solid var(--bd);padding-top:8px;font-weight:600"><span>Surplus</span><span>${num(o.surplus)}</span></div></div></div>${ass(r.assum)}`}
function lab(){const r=compute();const st=S.stress;
const sl=(l,id,mn,mx,sp,v,k,fmt)=>`<label style="display:flex;justify-content:space-between"><span>${l}</span><span><span class="mono" id="v-${k}">${fmt(v)}</span>${bdg("user","Stress value you set")}</span></label><input type="range" min="${mn}" max="${mx}" step="${sp}" value="${v}" oninput="setS('${k}',+this.value)">`;
const side=`<aside class="card" style="height:fit-content"><div class="eyebrow">Stress controls</div><div class="mono mut" id="ms"></div>
${sl("Revenue drop","",0,60,5,st.drop,"drop",v=>v+"%")}${sl("Payment delay","",0,120,15,st.delay,"delay",v=>v+" days")}
<label>Shock amount (₹)</label><input inputmode="numeric" value="${st.shock||""}" placeholder="0" onchange="S.stress.shock=pn(this.value)||0;body()">
${sl("Shock month","",1,12,1,st.sm,"sm",v=>"Month "+v)}
<label style="display:flex;align-items:center;gap:8px;margin-top:16px"><input type="checkbox" style="width:auto" ${S.confOnly?"checked":""} onchange="S.confOnly=this.checked;body()"> Confirmed inflows only</label>
<button class="o" style="width:100%;margin-top:12px" onclick="S.stress={drop:0,delay:0,shock:0,sm:3};go()">Reset stress</button><button style="width:100%;margin-top:8px" onclick="saveSc()">Save scenario</button></aside>`;
const dl=r.ok?`<button class="o" onclick="dlJson()">Export results.json</button>`:"";
setTimeout(body,0);return head("Step 3 of 3 · Digital twin","Scenario Lab",dl)+`<div class="lab">${side}<div id="labbody" style="min-width:0"></div></div>`}
function setS(k,v){S.stress[k]=v;const f={drop:v=>v+"%",delay:v=>v+" days",sm:v=>"Month "+v}[k];$("v-"+k).textContent=f(v);body()}
function dlJson(){const r=compute(),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(r,null,2)],{type:"application/json"}));a.download="results.json";a.click()}
function tog(id){const r=compute();const cur=selected(r);S.sel=cur.includes(id)?cur.filter(x=>x!==id):[...cur,id].slice(-4);body()}
const selected=r=>(S.sel??[...new Set([r.rank.fast,r.rank.safest,r.rank.cheap].filter(Boolean))]).filter(id=>r.plans.some(p=>p.id===id));
function body(){const el=$("labbody");if(!el)return;const r=compute();if($("ms"))$("ms").innerHTML=`re-ran in ${engMs.toFixed(1)} ms${bdg("engine","Engine recompute time")}`;if(!r.ok){el.innerHTML=missing(r.miss);return}
const sel=selected(r),by=id=>r.plans.find(p=>p.id===id),rs=r.ov.reserve.v,PC=["--pri","--c2","--c3","--c4"].map(col);
const series=[{id:"original",name:"Original (no purchase)",m:r.original,c:col("--mut"),dash:"dot"},...sel.map((id,i)=>({id,name:by(id).label,m:by(id).months,c:PC[i%4]}))];
const hov="<b>%{fullData.name}</b><br>%{x}<br>Opening %{customdata[0]}<br>Inflow %{customdata[1]}<br>Outflow %{customdata[2]}<br>Closing %{customdata[3]}<extra></extra>";
const data=[];
if(r.mc.on)series.forEach((s,i)=>{const b=r.mc.bands[s.id];if(!b)return;data.push({type:"scatter",x:r.labels,y:b.p10,mode:"lines",line:{width:0},showlegend:false,hoverinfo:"skip",legendgroup:s.id},{type:"scatter",x:r.labels,y:b.p90,mode:"lines",line:{width:0},fill:"tonexty",fillcolor:s.c+"26",name:s.name+" p10–p90",hoverinfo:"skip",legendgroup:s.id,showlegend:i<2})});
series.forEach(s=>{data.push({type:"scatter",mode:"lines+markers",name:s.name,x:r.labels,y:s.m.map(m=>m.closing),line:{color:s.c,width:s.id==="original"?2:3,dash:s.dash,shape:"spline",smoothing:.4},marker:{size:5},customdata:s.m.map(m=>[inr(m.opening),inr(m.inflow),inr(m.outflow),inr(m.closing)]),hovertemplate:hov,legendgroup:s.id});const br=s.m.filter(m=>m.breach);if(br.length)data.push({type:"scatter",mode:"markers",x:br.map(m=>m.label),y:br.map(m=>m.closing),marker:{symbol:"x-thin",size:13,line:{width:3,color:col("--bad")}},showlegend:false,hoverinfo:"skip",legendgroup:s.id})});
const foc=by(sel[0])?.months||r.original,x=foc.map(m=>m.label);
const bar=(n,y,c,e={})=>({type:"bar",name:n,x,y,marker:{color:c,...e}});
const fd=[bar("Run-rate income",foc.map(m=>m.rr),col("--ok")+"cc"),bar("Confirmed invoices",foc.map(m=>m.conf),col("--ok")),bar("Expected invoices",foc.map(m=>m.exp),col("--warn")+"40",{line:{color:col("--warn"),width:1},pattern:{shape:"/",fgcolor:col("--warn"),size:6}}),bar("Financing",foc.map(m=>m.fin),col("--c3")+"b3"),bar("Operating costs",foc.map(m=>-m.ops),col("--bad")+"8c"),bar("Plan payments",foc.map(m=>-m.plan),col("--bad")),bar("Shock",foc.map(m=>-m.shock),col("--fg")+"cc")];
const cards=[["fast","Fastest safe","Earliest purchase that never dips below reserve"],["safest","Safest","Largest lowest-point cushion above reserve"],["cheap","Cheapest","Lowest financing cost among safe plans"]].map(c=>{const p=r.rank[c[0]]&&by(r.rank[c[0]]);return`<button class="card pick ${p&&sel.includes(p.id)?"on":""}" ${p?`onclick="tog('${p.id}')"`:"disabled"}><div class="eyebrow">${c[1]}</div>${p?`<div class="disp" style="font-size:24px;line-height:1.15;margin:6px 0 10px">${p.label}</div><div class="row"><span class="mut">Extra cost</span><span>${num(p.cost)}</span></div><div class="row"><span class="mut">Lowest balance</span><span>${num(p.min)}</span></div><div class="row"><span class="mut">Above reserve</span><span>${num(p.head)}</span></div><div class="mut">${c[2]}</div>`:`<p class="bad">No plan stays above the reserve under this scenario. Reduce stress or see rejected plans.</p>`}</button>`}).join("");
el.innerHTML=`<div class="card" style="margin-bottom:16px"><div class="row"><h3>Month-end balance ${bdg("engine","Projected closing balance per month")}</h3><span class="mono mut">${r.mc.on?`Monte Carlo · ${r.mc.runs} runs ${bdg("mc",r.mc.reason)}`:"Monte Carlo off — "+r.mc.reason}</span></div><div id="ch-h"></div></div>
<div class="g g4">${cards}</div>
<details class="card" style="margin-bottom:16px"><summary>Rejected plans and why</summary>${r.rejected.map(x=>`<div style="padding:10px 0;border-top:1px solid var(--bd)"><div class="row"><b>${x.label}</b>${x.id?`<button class="${sel.includes(x.id)?"":"o"}" onclick="tog('${x.id}')">${sel.includes(x.id)?"On chart":"Show on chart"}</button>`:""}</div>${x.why.map(w=>`<div class="mut">${w} ${bdg("engine","Engine safety check against reserve")}</div>`).join("")}</div>`).join("")}</details>
<div class="card" style="margin-bottom:16px"><h3>Cash flows · ${by(sel[0])?.label||"Original"} ${bdg("engine","Monthly inflows and outflows used in the projection")}</h3><div id="ch-f"></div></div>${ass(r.assum)}`;
Plotly.react("ch-h",data,lay({h:430,l:{shapes:[resLine(rs)],annotations:[{xref:"paper",x:1,y:rs,xanchor:"right",yanchor:"bottom",text:"Reserve "+inr(rs),showarrow:false,font:{color:col("--bad"),size:11}}]}}),{displayModeBar:false,responsive:true});
Plotly.react("ch-f",fd,lay({h:300,l:{barmode:"relative",bargap:.25}}),{displayModeBar:false,responsive:true});post()}
function go(){const h=(location.hash||"#intake").slice(1),V={intake,overview,lab,explore},v=V[h]?h:"intake";
["intake","overview","lab","explore"].forEach(k=>$("n-"+k).className=k===v?"on":"");const r=compute();
$("status").innerHTML=`<span class="dot" style="background:${r.ok?"var(--ok)":"var(--warn)"}"></span>${r.ok?"engine ready":"awaiting data"} · ${engMs.toFixed(1)} ms${bdg("engine","Engine recompute time")}`;
$("app").innerHTML=V[v]();post()}
addEventListener("hashchange",go);go();
</script></body></html>
